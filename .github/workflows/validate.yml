name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить скиллы и инварианты
        run: ./scripts/validate.sh

      - name: shellcheck
        run: shellcheck -S error install.sh scripts/*.sh skills/*/*/bin/*

      - name: Установка в изолированный HOME
        run: |
          FAKE=$(mktemp -d)
          HOME="$FAKE" ./install.sh
          test -L "$FAKE/.claude/skills/afk"
          test -x "$FAKE/.local/bin/afk"
          test -L "$FAKE/.claude/afk-policy.md"
          HOME="$FAKE" ./install.sh --uninstall
          test ! -e "$FAKE/.claude/skills/afk"

      - name: Установка в проект
        run: |
          FAKE=$(mktemp -d); PROJ=$(mktemp -d)
          HOME="$FAKE" ./install.sh --project "$PROJ" afk
          test -L "$PROJ/.claude/skills/afk"
          HOME="$FAKE" ./install.sh --project "$PROJ" --uninstall afk
          test ! -e "$PROJ/.claude/skills/afk"
          test -x "$FAKE/.local/bin/afk"   # общие команды из проекта не снимаются
